name: 需求建议 / Feature request
description: 提出 CrossDesk 的新功能或改进建议。Suggest a new feature or improvement for CrossDesk.
title: "[Feature] "
labels: [enhancement]
assignees: [kunkundi]
body:
  - type: markdown
    attributes:
      value: |
        只需描述你的建议，其余选填。中文或英文均可。
        Only a description of your idea is required. Chinese or English is welcome.

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议 / Your idea
      description: 希望新增或改进什么？如方便，也请说明使用场景。What would you like to add or improve? If possible, describe when you would use it.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 补充说明（选填） / Additional context (optional)
      description: 可附截图、参考链接或其他说明。Add screenshots, links, or any other details.
    validations:
      required: false
